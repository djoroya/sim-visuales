<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Termobimetal: de CalculiX al tejado</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1f36; overflow: hidden; font-family: "Noto Sans", system-ui, sans-serif; }
  canvas { display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; color: #e8eef6; }
  #hud .bloque { position: absolute; left: 4.5%; top: 6%; transition: none; }
  #hud h1 { margin: 0 0 .35em; font-size: 2.1vw; font-weight: 700; letter-spacing: .01em; }
  #hud p { margin: .2em 0; font-size: 1.35vw; color: #c4d2e3; font-variant-numeric: tabular-nums; }
  #hud b { color: #f2c14e; }
  #barra { position: absolute; right: 5%; top: 20%; height: 45%; width: 1.1vw; border-radius: 4px; }
  #barra span { position: absolute; left: 1.8vw; font-size: 1.1vw; color: #c4d2e3; white-space: nowrap; transform: translateY(-50%); }
</style>
<script type="importmap">{ "imports": { "three": "/energia/pila-sofc/app/node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="hud">
  <div class="bloque" id="calculix"><h1>CalculiX: una hoja de termobimetal</h1>
    <p>150 × 50 × 0,2 mm · 3600 hexaedros (75 × 24 × 2 capas)</p>
    <p>calentada <b id="dT">+0 K</b> sobre su temperatura de cierre · la punta sube <b id="punta">0 mm</b></p></div>
  <div class="bloque" id="dia"><h1>Un día de julio en el tejado</h1>
    <p><b id="reloj">05:00</b> · fuera <span id="Te"></span> · hoja <span id="Th"></span></p>
    <p>las hojas se abren solas con el sol y el calor</p></div>
  <div id="barra"><span style="top:0%">80 mm</span><span style="top:50%">40</span><span style="top:100%">0</span></div>
</div>
<script type="module" src="./escena.js"></script>
</body>
</html>
